<section
  class="bg-gray-100 py-16 relative z-10"
  x-data="{
        categories: [
            { title: 'ARRANCADOR DE MOTOR', subtitle: 'Potencia de ignición', img: '/arrancador.png', cta: 'VER CATÁLOGO' },
            { title: 'ALTERNADOR DE MOTOR', subtitle: 'Energía constante', img: '/alternador.png', cta: 'VER CATÁLOGO' },
            { title: 'PLATO DE EMBRAGUE', subtitle: 'Transmisión precisa', img: '/plato.png', cta: 'VER CATÁLOGO' },
            { title: 'DISCO DE EMBRAGUE', subtitle: 'Fricción duradera', img: '/disco.png', cta: 'VER CATÁLOGO' }
        ]
    }"
>
  <div class="container mx-auto px-4">
    <div class="text-center mb-12">
      <h3
        class="text-3xl font-extrabold text-gray-800 uppercase tracking-widest"
      >
        Nuestros Productos
      </h3>
      <div class="h-1 w-20 bg-[#D32F2F] mx-auto mt-3"></div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <template x-for="cat in categories">
        <div
          class="group relative bg-white rounded-lg shadow-md hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 cursor-pointer overflow-hidden border-t-4 border-[#D32F2F] flex flex-col"
        >
          <div
            class="absolute -right-10 -top-10 w-32 h-32 bg-gray-50 rounded-full transition-transform group-hover:scale-150 z-0"
          ></div>

          <div
            class="p-6 flex flex-col items-center text-center h-full relative z-10"
          >
            <div class="h-40 w-full flex items-center justify-center mb-4">
              <img
                :src="cat.img"
                :alt="cat.title"
                class="h-full w-auto max-w-full object-contain filter drop-shadow-lg transition-transform duration-500 group-hover:scale-110"
              />
            </div>

            <h3
              class="text-lg font-black text-gray-900 uppercase leading-tight mb-1"
              x-text="cat.title"
            ></h3>

            <p
              class="text-xs text-gray-500 font-medium tracking-wide mb-6"
              x-text="cat.subtitle"
            ></p>

            <div class="mt-auto">
              <span
                class="inline-flex items-center text-sm font-bold text-[#D32F2F] group-hover:text-black transition-colors border-b-2 border-transparent group-hover:border-[#D32F2F] pb-0.5"
              >
                <span x-text="cat.cta"></span>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4 ml-1 transform group-hover:translate-x-1 transition-transform"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M9 5l7 7-7 7"
                  />
                </svg>
              </span>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</section>
